# FastAPI backend + Vinext/Vite frontend + mock PrusaLink printers.
# Postgres/Auth still come from Supabase (see backend/.env). Do not commit that file.
services:
  mockserver:
    container_name: mockserver
    build:
      context: ./mockserver
    ports:
      - "8080:8080"

  backend:
    container_name: backend
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Container-local upload path (overrides host-relative ./storage from .env)
      FILE_STORAGE_ROOT: ./storage
      # Never auto-migrate a shared Supabase DB on boot. Set to 1 only for a
      # disposable/fresh database you intentionally want upgraded.
      RUN_MIGRATIONS: "0"
      # Ensure the Compose UI origin is allowed even if .env omits it.
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
      # Reach mock printers on the Compose network (overrides localhost in .env).
      MOCK_PRINTER_BASE_URL: http://mockserver:8080
      # Poll PrusaLink and dispatch queued jobs (0 disables; demo overlay also sets this).
      PRINTER_POLL_INTERVAL_S: "2"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - mockserver

  frontend:
    container_name: frontend
    build:
      context: ./frontend/UWA-3D-Print-Farm
    ports:
      - "5173:5173"
    environment:
      # Browser runs on the host, so use localhost (not the Compose service name).
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
