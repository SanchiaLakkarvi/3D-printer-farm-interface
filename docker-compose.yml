# FastAPI backend + Vinext/Vite frontend against Supabase (Postgres + Auth).
# Do not commit backend/.env — it contains secrets.
services:
  backend:
    container_name: backend
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Container-local upload path (overrides host-relative ./storage from .env)
      FILE_STORAGE_ROOT: ./storage
      # Never auto-migrate a shared Supabase DB on boot. Set to 1 only for a
      # disposable/fresh database you intentionally want upgraded.
      RUN_MIGRATIONS: "0"
      # Ensure the Compose UI origin is allowed even if .env omits it.
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    container_name: frontend
    build:
      context: ./frontend/UWA-3D-Print-Farm
    ports:
      - "5173:5173"
    environment:
      # Browser runs on the host, so use localhost (not the Compose service name).
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
